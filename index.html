<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>FDH GPS Logger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E4002B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FDH Logger">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root{
    --primary: #E4002B;
    --primary-dark: #A80020;
    --on-primary: #FFFFFF;
    --primary-container: #FFDAD9;
    --on-primary-container: #410004;

    --bg: #EAF6ED;
    --surface: #FFFFFF;
    --surface-variant: #F1FAF3;
    --outline: #D3E8D8;
    --on-surface: #1B1F1C;
    --on-surface-variant: #5C6B60;

    --amber: #966400;
    --amber-container: #FFDDA6;
    --error: #BA1B1B;
    --error-container: #FFDAD6;

    --mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

    --e1: 0 1px 2px rgba(0,0,0,0.16), 0 1px 3px 1px rgba(0,0,0,0.08);
    --e2: 0 1px 3px rgba(0,0,0,0.18), 0 3px 6px rgba(0,0,0,0.10);
    --e3: 0 4px 8px rgba(0,0,0,0.18), 0 6px 14px rgba(0,0,0,0.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--on-surface); font-family:var(--sans); }
  body{ min-height:100vh; padding-bottom:36px; }
  ::selection{ background:rgba(228,0,43,0.25); }

  .icon{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ---------- Material ripple (works on any surface) ---------- */
  .ripple-host{ position:relative; overflow:hidden; }
  .ripple{ position:absolute; border-radius:50%; transform:scale(0); animation:rippleAnim .5s ease-out; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  /* ---------- Top App Bar ---------- */
  .appbar{
    background:linear-gradient(180deg, var(--primary) 0%, var(--primary) 100%);
    color:var(--on-primary); padding:14px 16px 16px; box-shadow:var(--e2);
    position:sticky; top:0; z-index:10;
  }
  .appbar-row{ display:flex; align-items:center; justify-content:space-between; max-width:560px; margin:0 auto; }
  .appbar-brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .appbar-mark{
    width:36px; height:36px; border-radius:10px; flex-shrink:0; background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
  }
  .appbar-mark .icon{ width:20px; height:20px; stroke:#fff; }
  .appbar-text h1{ font-size:18px; font-weight:500; margin:0; line-height:1.25; }
  .appbar-text p{ font-size:12px; margin:1px 0 0; color:rgba(255,255,255,0.82); }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.16); }

  /* ---------- Content shell ---------- */
  .content{ max-width:560px; margin:0 auto; padding:16px; }

  /* ---------- Stat row (as a surface card) ---------- */
  .stats-card{ background:var(--surface); border-radius:16px; box-shadow:var(--e1); display:flex; padding:14px 4px; margin-bottom:16px; }
  .stat{ flex:1; text-align:center; }
  .stat + .stat{ border-left:1px solid var(--outline); }
  .stat .num{ font-family:var(--mono); font-size:21px; font-weight:500; line-height:1; color:var(--on-surface); }
  .stat .lbl{ font-size:11px; color:var(--on-surface-variant); margin-top:5px; text-transform:uppercase; letter-spacing:.04em; }
  .stat.synced .num{ color:var(--primary); }
  .stat.pending .num{ color:var(--amber); }

  /* ---------- Settings panel (Material dialog-like surface) ---------- */
  .settings-panel{
    background:var(--surface); border-radius:16px; box-shadow:var(--e1);
    display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .3s ease, opacity .25s ease, margin .3s ease;
  }
  .settings-panel.open{ grid-template-rows:1fr; opacity:1; margin-bottom:16px; }
  .settings-panel > div{ overflow:hidden; padding:0 16px; }
  .settings-panel.open > div{ padding:16px; }
  .settings-panel p{ font-size:13px; color:var(--on-surface-variant); line-height:1.55; margin:0 0 14px; }

  /* ---------- Card (Material elevated surface) ---------- */
  .card{ background:var(--surface); border-radius:16px; box-shadow:var(--e1); padding:20px; margin-bottom:16px; }
  .card-title{ font-size:13px; font-weight:500; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.05em; margin:0 0 14px; }

  /* ---------- GPS FAB row ---------- */
  .gps-row{ display:flex; align-items:center; gap:16px; }
  .fab{
    flex-shrink:0; width:56px; height:56px; border-radius:16px; border:none;
    background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--e2); transition:box-shadow .15s ease, transform .15s ease;
  }
  .fab:active{ box-shadow:var(--e1); transform:scale(0.96); }
  .fab .icon{ width:24px; height:24px; }
  .fab.locating{ animation:fabPulse 1.2s ease-in-out infinite; }
  @keyframes fabPulse{ 0%,100%{ box-shadow:var(--e2);} 50%{ box-shadow:var(--e3), 0 0 0 8px rgba(228,0,43,0.16);} }
  .fab.locked{ animation:fabLock .4s ease; }
  @keyframes fabLock{ 0%{ transform:scale(1);} 40%{ transform:scale(1.12);} 100%{ transform:scale(1);} }

  .gps-info .lbl{ font-size:12px; color:var(--on-surface-variant); margin-bottom:3px; }
  .gps-info .coords{ font-family:var(--mono); font-size:15px; word-break:break-all; }
  .gps-info .coords.empty{ font-family:var(--sans); font-size:13.5px; color:var(--on-surface-variant); }
  .gps-info .acc{ font-family:var(--mono); font-size:11px; color:var(--on-surface-variant); margin-top:2px; }

  /* ---------- Material filled text fields ---------- */
  .field{ margin-top:18px; }
  .field label{ display:block; font-size:12.5px; color:var(--on-surface-variant); margin-bottom:6px; font-weight:500; }
  .field .input-wrap{ position:relative; }
  .field input, .field textarea{
    width:100%; background:var(--surface-variant); border:none; border-radius:8px 8px 0 0;
    border-bottom:1.5px solid var(--on-surface-variant); padding:13px 12px 11px; color:var(--on-surface);
    font-size:15px; font-family:var(--sans); transition:border-color .15s ease, border-width .15s ease;
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus, .field textarea:focus{ outline:none; border-bottom:2px solid var(--primary); padding-bottom:10.5px; }

  .photo-row{ display:flex; align-items:center; gap:12px; margin-top:18px; }
  .btn-outline{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    border:1.5px solid var(--outline); background:transparent; color:var(--on-surface-variant);
    border-radius:20px; padding:11px 16px; font-size:14px; font-weight:500; cursor:pointer; font-family:var(--sans);
  }
  .btn-outline:active{ background:rgba(228,0,43,0.06); border-color:var(--primary); color:var(--primary); }
  .photo-thumb-wrap{ position:relative; display:none; flex-shrink:0; }
  .photo-thumb-wrap.show{ display:block; }
  .photo-thumb{ width:52px; height:52px; border-radius:10px; object-fit:cover; box-shadow:var(--e1); display:block; }
  .photo-remove{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--error); border:2px solid var(--surface); color:#fff; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .btn-filled{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:20px;
    background:var(--primary); color:var(--on-primary); font-size:15px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:var(--e1); font-family:var(--sans);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .btn-filled:active{ transform:scale(0.98); box-shadow:none; }
  .btn-filled:disabled{ background:var(--outline); color:var(--on-surface-variant); box-shadow:none; }
  .btn-filled .icon{ width:18px; height:18px; }
  .btn-filled.success{ animation:flashWhite .5s ease; }
  @keyframes flashWhite{ 45%{ background:#fff; color:var(--primary); } }

  .btn-tonal{
    border:none; border-radius:20px; background:var(--primary-container); color:var(--on-primary-container);
    font-size:12px; font-weight:500; cursor:pointer; font-family:var(--sans);
  }

  .snackbar{
    font-size:13px; margin-top:12px; padding:11px 14px; border-radius:10px; opacity:0; transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease; box-shadow:var(--e1);
  }
  .snackbar.show{ opacity:1; transform:translateY(0); }
  .snackbar.err{ background:var(--error-container); color:var(--error); }
  .snackbar.ok{ background:var(--primary-container); color:var(--on-primary-container); }

  /* ---------- Log list ---------- */
  .log-header{ display:flex; align-items:baseline; justify-content:space-between; margin:4px 4px 10px; }
  .log-header h2{ font-size:15px; font-weight:500; margin:0; }
  .log-header span{ font-family:var(--mono); font-size:12px; color:var(--on-surface-variant); }

  .log{ display:flex; flex-direction:column; gap:10px; }
  .entry{
    background:var(--surface); border-radius:14px; box-shadow:var(--e1); padding:14px; display:flex; gap:12px;
    animation:entryIn .32s ease; transition:opacity .2s ease, transform .2s ease, max-height .2s ease;
  }
  @keyframes entryIn{ 0%{ opacity:0; transform:translateY(-6px);} 100%{ opacity:1; transform:translateY(0);} }
  .entry.exiting{ opacity:0; transform:translateX(20px); max-height:0; padding:0 14px; overflow:hidden; }
  .entry-photo{ width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .entry-photo-empty{
    width:52px; height:52px; border-radius:10px; background:var(--surface-variant); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--on-surface-variant);
  }
  .entry-photo-empty .icon{ width:18px; height:18px; }
  .entry-main{ flex:1; min-width:0; }
  .entry-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .entry-id{ font-weight:500; font-size:14.5px; }
  .entry-ex{ color:var(--on-surface-variant); font-size:12.5px; margin-top:1px; }
  .entry-del{ background:none; border:none; color:var(--on-surface-variant); cursor:pointer; padding:4px; flex-shrink:0; border-radius:50%; }
  .entry-del:active{ color:var(--error); background:var(--error-container); }
  .entry-coords{ font-family:var(--mono); font-size:12.5px; color:var(--amber); margin-top:7px; }
  .entry-notes{ font-size:12.5px; color:var(--on-surface-variant); margin-top:5px; }
  .entry-foot{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .entry-time{ font-size:10.5px; color:var(--on-surface-variant); font-family:var(--mono); }
  .chip{ font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:500; }
  .chip.sent{ background:var(--primary-container); color:var(--on-primary-container); }
  .chip.pending{ background:var(--amber-container); color:var(--amber); }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--on-surface-variant); font-size:13px; background:var(--surface); border-radius:16px; box-shadow:var(--e1); }
  .empty-state .icon{ width:28px; height:28px; margin:0 auto 10px; opacity:0.55; }

  /* ---------- Footer action bar ---------- */
  .footer-actions{ display:flex; gap:10px; margin-top:20px; }
  .fbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 6px; border-radius:14px; border:none; background:var(--surface);
    color:var(--on-surface-variant); font-size:11px; cursor:pointer; box-shadow:var(--e1); font-family:var(--sans);
  }
  .fbtn .icon{ width:20px; height:20px; }
  .fbtn.primary{ color:var(--primary); background:var(--primary-container); box-shadow:none; }
  .fbtn.spin .icon{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .drive-note{ font-size:11.5px; color:var(--on-surface-variant); text-align:center; margin-top:16px; line-height:1.55; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></symbol>

      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></symbol>

      <symbol id="i-broom" viewBox="0 0 24 24"><path d="M3 21l6-6M13 4l7 7-8.5 8.5a3 3 0 0 1-4.24 0l-2.76-2.76a3 3 0 0 1 0-4.24z"></path><path d="M13 4 9 0"></path></symbol>

    </defs>
  </svg>

  <div class="appbar">
    <div class="appbar-row">
      <div class="appbar-brand">
        <div class="appbar-mark"><svg class="icon"><use href="#i-pin"/></svg></div>
        <div class="appbar-text">
          <h1>FDH GPS Logger</h1>
          <p>PTCL LTR-South field capture</p>
        </div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="stats-card">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
      <div class="stat synced"><div class="num" id="statSynced">0</div><div class="lbl">Synced</div></div>
      <div class="stat pending"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
    </div>

    <div class="card">
      <div class="gps-row">
        <button class="fab ripple-host" id="gpsBtn" aria-label="Capture location"><svg class="icon"><use href="#i-pin"/></svg></button>
        <div class="gps-info">
          <div class="lbl">Current fix</div>
          <div class="coords empty" id="coordsText">Tap to capture GPS</div>
          <div class="acc" id="metaText"></div>
        </div>
      </div>

      <div class="field">
        <label for="fdhId">FDH ID *</label>
        <input type="text" id="fdhId" placeholder="e.g. FDH-LHR-0231" autocomplete="off">
      </div>
      <div class="field">
        <label for="fdhName">Name / Exchange</label>
        <input type="text" id="fdhName" placeholder="e.g. Garden Town" autocomplete="off">
      </div>
      <div class="field">
        <label for="notes">Remarks</label>
        <textarea id="notes" placeholder="Optional — pole ref, access notes, condition..."></textarea>
      </div>

      <div class="photo-row">
        <button class="btn-outline ripple-host" id="photoBtn"><svg class="icon"><use href="#i-camera"/></svg>Add photo (optional)</button>
        <div class="photo-thumb-wrap" id="photoThumbWrap">
          <img class="photo-thumb" id="photoThumb" alt="">
          <button class="photo-remove" id="photoClear" aria-label="Remove photo">×</button>
        </div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">

      <button class="btn-filled ripple-host" id="saveBtn" disabled><svg class="icon"><use href="#i-check"/></svg>Save entry</button>
      <div class="snackbar" id="statusBox"></div>
    </div>

    <div class="log-header">
      <h2>Field log</h2>
      <span id="entryCount">0 entries</span>
    </div>
    <div class="log" id="entryList"></div>

    <div class="footer-actions">
      <button class="fbtn primary ripple-host" id="syncAllBtn"><svg class="icon"><use href="#i-cloud"/></svg>Sync</button>
      <button class="fbtn ripple-host" id="exportCsvBtn"><svg class="icon"><use href="#i-file-csv"/></svg>CSV</button>
      <button class="fbtn ripple-host" id="exportXlsxBtn"><svg class="icon"><use href="#i-file-xls"/></svg>Excel</button>
      <button class="fbtn ripple-host" id="clearBtn"><svg class="icon"><use href="#i-broom"/></svg>Clear</button>
    </div>
    <div class="drive-note">Entries save to this device first, then send to your Google Sheet when synced. Offline in the field? Keep logging — sync once you have signal.</div>

  </div>

<script>
  // ---- Material ripple for every button ----
  document.addEventListener('pointerdown', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    btn.classList.add('ripple-host');
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.2;
    const span = document.createElement('span');
    span.className = 'ripple';
    const isFilled = btn.classList.contains('btn-filled') || btn.classList.contains('fab');
    span.style.background = isFilled ? 'rgba(255,255,255,0.35)' : 'rgba(228,0,43,0.16)';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(function(){ span.remove(); }, 500);
  });

(function(){
  const storageAPI = (function(){
    const hasNative = (typeof window.storage !== 'undefined') && window.storage !== null;
    return {
      hasNative: hasNative,
      async get(key){
        if(hasNative){ try{ return await window.storage.get(key); }catch(e){ return null; } }
        const v = localStorage.getItem(key);
        return v === null ? null : { key: key, value: v };
      },
      async set(key, value){
        if(hasNative) return await window.storage.set(key, value);
        localStorage.setItem(key, value);
        return { key: key, value: value };
      },
      async delete(key){
        if(hasNative) return await window.storage.delete(key);
        localStorage.removeItem(key);
        return { key: key, deleted: true };
      }
    };
  })();

  let index = [];
  let entriesCache = {};
  let pendingFix = null;
  let pendingPhoto = null;
  let settings = { scriptUrl: '' };
  let knownIds = new Set();
  let lastStats = { total: 0, synced: 0, pending: 0 };

  const gpsBtn = document.getElementById('gpsBtn');
  const coordsText = document.getElementById('coordsText');
  const metaText = document.getElementById('metaText');
  const fdhId = document.getElementById('fdhId');
  const fdhName = document.getElementById('fdhName');
  const notes = document.getElementById('notes');
  const saveBtn = document.getElementById('saveBtn');
  const statusBox = document.getElementById('statusBox');
  const entryList = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');
  const photoThumb = document.getElementById('photoThumb');
  const photoThumbWrap = document.getElementById('photoThumbWrap');
  const photoClear = document.getElementById('photoClear');
  const statTotal = document.getElementById('statTotal');
  const statSynced = document.getElementById('statSynced');
  const statPending = document.getElementById('statPending');

  // ---- Count-up animation for stat numbers ----
  function animateNumber(el, from, to){
    if(from === to){ el.textContent = to; return; }
    const duration = 420;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = to;
    }
    requestAnimationFrame(tick);
  }

  function showStatus(msg, type){
    statusBox.textContent = msg;
    statusBox.className = 'snackbar ' + type;
    requestAnimationFrame(function(){ statusBox.classList.add('show'); });
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(function(){ statusBox.classList.remove('show'); }, 4200);
  }
  function updateSaveEnabled(){ saveBtn.disabled = !(pendingFix && fdhId.value.trim().length > 0); }
  fdhId.addEventListener('input', updateSaveEnabled);
  function fmtCoord(n){ return n.toFixed(6); }
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ---- GPS capture ----
  gpsBtn.addEventListener('click', function(){
    if(!('geolocation' in navigator)){ showStatus('Geolocation is not available in this browser/context.', 'err'); return; }
    gpsBtn.classList.add('locating');
    coordsText.classList.add('empty'); coordsText.textContent = 'Locating…'; metaText.textContent = '';
    navigator.geolocation.getCurrentPosition(function(pos){
      gpsBtn.classList.remove('locating');
      gpsBtn.classList.add('locked');
      setTimeout(function(){ gpsBtn.classList.remove('locked'); }, 500);
      pendingFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      coordsText.classList.remove('empty');
      coordsText.textContent = fmtCoord(pendingFix.lat) + ', ' + fmtCoord(pendingFix.lng);
      coordsText.classList.remove('pop'); void coordsText.offsetWidth; coordsText.classList.add('pop');
      metaText.textContent = '±' + Math.round(pendingFix.accuracy) + 'm accuracy';
      updateSaveEnabled();
    }, function(err){
      gpsBtn.classList.remove('locating');
      coordsText.classList.add('empty'); coordsText.textContent = 'Tap to capture GPS';
      let msg = 'Could not get location.';
      if(err.code === 1) msg = 'Location permission denied. Allow location access and try again.';
      else if(err.code === 2) msg = 'Location unavailable. Try moving to open sky.';
      else if(err.code === 3) msg = 'Location request timed out. Try again.';
      showStatus(msg, 'err');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  // ---- Photo capture + compression ----
  photoBtn.addEventListener('click', function(){ photoInput.click(); });
  photoInput.addEventListener('change', function(){
    const file = photoInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        pendingPhoto = canvas.toDataURL('image/jpeg', 0.6);
        photoThumb.src = pendingPhoto;
        photoThumbWrap.classList.add('show');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  photoClear.addEventListener('click', function(){
    pendingPhoto = null; photoInput.value = ''; photoThumbWrap.classList.remove('show');
  });

  // ---- Settings ----
  // Draws an FDH ID, lat/long, and timestamp bar onto the bottom of a photo.
  function stampPhoto(dataUrl, fix, meta){
    return new Promise(function(resolve){
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const lines = [];
        if(meta.fdhId) lines.push('FDH: ' + meta.fdhId + (meta.name ? '  \u2014  ' + meta.name : ''));
        lines.push('Lat/Long: ' + fix.lat.toFixed(6) + ', ' + fix.lng.toFixed(6) + '  (\u00b1' + Math.round(fix.accuracy) + 'm)');
        lines.push(meta.tsDisplay);

        const fontSize = Math.max(13, Math.round(canvas.width * 0.026));
        const lineHeight = Math.round(fontSize * 1.5);
        const padding = Math.round(fontSize * 0.8);
        const barHeight = lines.length * lineHeight + padding * 2;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);
        ctx.font = fontSize + 'px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textBaseline = 'top';
        lines.forEach(function(line, i){
          ctx.fillText(line, padding, canvas.height - barHeight + padding + i * lineHeight);
        });
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  // ---- Save entry ----
  saveBtn.addEventListener('click', async function(){
    if(!pendingFix || !fdhId.value.trim()) return;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const nowIso = new Date().toISOString();
    let finalPhoto = pendingPhoto || null;
    if(pendingPhoto){
      try{
        finalPhoto = await stampPhoto(pendingPhoto, pendingFix, {
          fdhId: fdhId.value.trim(), name: fdhName.value.trim(), tsDisplay: new Date(nowIso).toLocaleString()
        });
      }catch(e){ finalPhoto = pendingPhoto; }
    }
    const entry = {
      id: id, fdhId: fdhId.value.trim(), name: fdhName.value.trim(), notes: notes.value.trim(),
      lat: pendingFix.lat, lng: pendingFix.lng, accuracy: pendingFix.accuracy,
      ts: nowIso, photo: finalPhoto, synced: false
    };
    try{
      await storageAPI.set('fdh-entry-' + id, JSON.stringify(entry));
      entriesCache[id] = entry;
      index.unshift({ id: id, synced: false });
      await persistIndex();
      render();
    }catch(e){ showStatus('Could not save entry (storage error).', 'err'); return; }

    fdhId.value=''; fdhName.value=''; notes.value='';
    pendingFix = null; pendingPhoto = null;
    coordsText.classList.add('empty'); coordsText.textContent = 'Tap to capture GPS'; metaText.textContent='';
    photoThumbWrap.classList.remove('show'); photoInput.value='';
    updateSaveEnabled();
    saveBtn.classList.remove('success'); void saveBtn.offsetWidth; saveBtn.classList.add('success');
    showStatus('Entry saved on device.', 'ok');
    if(settings.scriptUrl) syncEntry(id);
  });

  // ---- Sync to Google Sheet ----
  async function syncEntry(id){
    const entry = entriesCache[id];
    if(!entry || !settings.scriptUrl) return;
    try{
      await fetch(settings.scriptUrl, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          fdhId: entry.fdhId, name: entry.name, remarks: entry.notes,
          lat: entry.lat, lng: entry.lng, accuracy: Math.round(entry.accuracy),
          timestamp: entry.ts, photo: entry.photo
        })
      });
      entry.synced = true;
      const idx = index.find(x => x.id === id);
      if(idx) idx.synced = true;
      await storageAPI.set('fdh-entry-' + id, JSON.stringify(entry));
      await persistIndex();
      render();
    }catch(e){ showStatus('Sync failed for one entry — check your connection.', 'err'); }
  }

  document.getElementById('syncAllBtn').addEventListener('click', async function(){
    if(!settings.scriptUrl){ showStatus('Sheet link is not configured — contact the app admin.', 'err'); return; }
    const unsent = index.filter(x => !x.synced);
    if(unsent.length === 0){ showStatus('Everything is already sent.', 'ok'); return; }
    const btn = document.getElementById('syncAllBtn');
    btn.classList.add('spin');
    showStatus('Sending ' + unsent.length + ' entries…', 'ok');
    for(const item of unsent){
      if(!entriesCache[item.id]){
        try{
          const res = await storageAPI.get('fdh-entry-' + item.id);
          if(res && res.value) entriesCache[item.id] = JSON.parse(res.value);
        }catch(e){ continue; }
      }
      await syncEntry(item.id);
    }
    btn.classList.remove('spin');
    showStatus('Sync requests sent.', 'ok');
  });

  // ---- Render ----
  function render(){
    entryCount.textContent = index.length + (index.length === 1 ? ' entry' : ' entries');
    const syncedN = index.filter(x => x.synced).length;
    animateNumber(statTotal, lastStats.total, index.length);
    animateNumber(statSynced, lastStats.synced, syncedN);
    animateNumber(statPending, lastStats.pending, index.length - syncedN);
    lastStats = { total: index.length, synced: syncedN, pending: index.length - syncedN };

    if(index.length === 0){
      entryList.innerHTML = '<div class="empty-state"><svg class="icon" style="width:26px;height:26px;margin:0 auto 10px;display:block"><use href="#i-log"/></svg>No entries yet. Capture your first FDH location above.</div>';
      knownIds = new Set();
      return;
    }
    entryList.innerHTML = index.map(function(item){
      const e = entriesCache[item.id];
      if(!e) return '';
      const d = new Date(e.ts);
      const timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const tag = item.synced ? '<span class="chip sent">sent</span>' : '<span class="chip pending">on device</span>';
      const photoEl = e.photo
        ? '<img class="entry-photo" src="'+e.photo+'">'
        : '<div class="entry-photo-empty"><svg class="icon"><use href="#i-image"/></svg></div>';
      return '<div class="entry" data-id="'+e.id+'">'
        + photoEl
        + '<div class="entry-main">'
        +   '<div class="entry-top">'
        +     '<div><div class="entry-id">'+escapeHtml(e.fdhId)+'</div>'
        +     (e.name ? '<div class="entry-ex">'+escapeHtml(e.name)+'</div>' : '')
        +     '</div>'
        +     '<button class="entry-del" aria-label="Delete entry"><svg class="icon" style="width:16px;height:16px"><use href="#i-trash"/></svg></button>'
        +   '</div>'
        +   '<div class="entry-coords">'+fmtCoord(e.lat)+', '+fmtCoord(e.lng)+' · ±'+Math.round(e.accuracy)+'m</div>'
        +   (e.notes ? '<div class="entry-notes">'+escapeHtml(e.notes)+'</div>' : '')
        +   '<div class="entry-foot"><span class="entry-time">'+timeStr+'</span>'+tag+'</div>'
        + '</div>'
        + '</div>';
    }).join('');
    knownIds = new Set(index.map(x => x.id));

    entryList.querySelectorAll('.entry-del').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const row = btn.closest('.entry');
        const id = row.dataset.id;
        row.classList.add('exiting');
        setTimeout(async function(){
          try{ await storageAPI.delete('fdh-entry-' + id); }catch(e){}
          delete entriesCache[id];
          index = index.filter(x => x.id !== id);
          await persistIndex();
          render();
        }, 260);
      });
    });
  }

  async function persistIndex(){
    try{ await storageAPI.set('fdh-index', JSON.stringify(index)); }
    catch(e){ showStatus('Warning: could not save index.', 'err'); }
  }

  // ---- Export ----
  function buildRows(){
    return index.map(function(item){
      const e = entriesCache[item.id];
      return {
        FDH_ID: e.fdhId, Name: e.name, Latitude: e.lat, Longitude: e.lng,
        Accuracy_m: Math.round(e.accuracy), Remarks: e.notes, Timestamp: e.ts,
        Synced: item.synced ? 'yes' : 'no'
      };
    });
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  document.getElementById('exportCsvBtn').addEventListener('click', function(){
    if(index.length === 0){ showStatus('No entries to export yet.', 'err'); return; }
    const rows = buildRows();
    const header = Object.keys(rows[0]);
    const csv = [header.join(',')].concat(rows.map(function(r){
      return header.map(function(h){
        let v = String(r[h] == null ? '' : r[h]);
        if(v.includes(',') || v.includes('"') || v.includes('\n')) v = '"' + v.replace(/"/g,'""') + '"';
        return v;
      }).join(',');
    })).join('\n');
    downloadBlob(new Blob([csv], {type:'text/csv;charset=utf-8;'}), 'fdh-gps-log-' + new Date().toISOString().slice(0,10) + '.csv');
    showStatus('CSV exported.', 'ok');
  });
  document.getElementById('exportXlsxBtn').addEventListener('click', function(){
    if(index.length === 0){ showStatus('No entries to export yet.', 'err'); return; }
    if(typeof XLSX === 'undefined'){ showStatus('Excel export library did not load — try CSV instead.', 'err'); return; }
    const rows = buildRows();
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'FDH Log');
    XLSX.writeFile(wb, 'fdh-gps-log-' + new Date().toISOString().slice(0,10) + '.xlsx');
    showStatus('Excel file exported.', 'ok');
  });
  document.getElementById('clearBtn').addEventListener('click', async function(){
    if(index.length === 0) return;
    if(!confirm('Delete all ' + index.length + ' saved entries? This cannot be undone.')) return;
    for(const item of index){ try{ await storageAPI.delete('fdh-entry-' + item.id); }catch(e){} }
    index = []; entriesCache = {};
    await persistIndex(); render();
    showStatus('All entries cleared.', 'ok');
  });

  const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUxFR6noXccxsF9TprqzVay0C1CVRrxQM7p14iUtPqZlFQDPi_FajscSY6E7_xlGYFxg/exec';

  async function load(){
    // The Google Sheet URL is fixed in code — there's no in-app UI to change it,
    // so it can't be accidentally (or deliberately) redirected by someone using the app.
    settings.scriptUrl = DEFAULT_SCRIPT_URL;
    try{
      const res = await storageAPI.get('fdh-index');
      if(res && res.value) index = JSON.parse(res.value);
    }catch(e){ index = []; }
    for(const item of index){
      try{
        const res = await storageAPI.get('fdh-entry-' + item.id);
        if(res && res.value) entriesCache[item.id] = JSON.parse(res.value);
      }catch(e){ /* entry missing, skip */ }
    }
    render();
  }
  load();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('Service worker registration failed', e); });
    });
  }
})();
</script>
</body>
</html>
